# Scheda 25 — ogni 5 minuti: app e database di VivAIo rispondono? Avviso email al cambio di stato.
name: Sentinella

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: sentinella

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controllo
        env:
          APP_URL: ${{ vars.APP_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          OPS_REPORT_SECRET: ${{ secrets.OPS_REPORT_SECRET }}
        run: node sentinella.mjs
      - name: Salva lo stato
        run: |
          if ! git diff --quiet stato.json; then
            git config user.name "vivaio-sentinella"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Stato: $(node -p 'JSON.parse(require("fs").readFileSync("stato.json")).ok ? "ok" : "giù"')"
            git push
          fi
